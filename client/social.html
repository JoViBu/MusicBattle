<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10031d">
  <title>Joc · Music Battle</title>
  <link rel="stylesheet" href="social.css?v=1">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a href="index.html" class="back">‹ Jocs</a>
      <div><span id="gameKicker">JOC AMB AMICS</span><h1 id="gameTitle">Dibuixa i endevina</h1></div>
      <span id="connection" class="connection">Connectant…</span>
    </header>

    <section id="setupScreen" class="screen active card setup-card">
      <div class="hero-icon" id="heroIcon">✎</div>
      <h2 id="setupTitle">Dibuixa i endevina</h2>
      <p id="setupText">Un dibuixa. L’altre intenta endevinar.</p>
      <label>El teu nom<input id="playerName" maxlength="20" autocomplete="nickname" placeholder="Nom"></label>
      <button id="createRoom" class="primary big">Crear sala</button>
      <div class="divider"><span>o entra amb codi</span></div>
      <div class="join-row"><input id="roomCodeInput" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE"><button id="joinRoom">Entrar</button></div>
    </section>

    <section id="roomScreen" class="screen card">
      <p class="eyebrow">CODI DE SALA</p>
      <button id="copyCode" class="room-code" title="Copiar codi">-----</button>
      <p class="muted">Passa aquest codi al teu amic.</p>
      <div id="players" class="players"></div>
      <button id="startGame" class="primary big">Començar</button>
      <button id="leaveRoom" class="ghost">Sortir de la sala</button>
    </section>

    <section id="playScreen" class="screen">
      <div class="game-status card slim">
        <div><small id="roundLabel">RONDA 1/8</small><b id="roleLabel">Preparant…</b></div>
        <div id="timer" class="timer">1:00</div>
        <div id="scoreLabel" class="score">0 - 0</div>
      </div>
      <div id="gameMount"></div>
      <div id="roundNotice" class="round-notice" hidden></div>
      <button id="quitGame" class="ghost bottom">Sortir</button>
    </section>

    <section id="resultsScreen" class="screen card results-card">
      <div class="hero-icon">★</div>
      <h2 id="winnerText">Partida acabada</h2>
      <div id="ranking" class="ranking"></div>
      <button id="playAgain" class="primary big">Tornar a jugar</button>
      <a class="ghost link-button" href="index.html">Tornar als jocs</a>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="social.js?v=1"></script>
</body>
</html>
